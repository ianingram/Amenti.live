<!DOCTYPE html>
<!-- REPO: Amenti.live/index.html
     The repo has no index.html, so the bare URL 404s — including the link in
     the repo's own About box. The entry page is Page1.html.

     This sends the bare URL there: a meta refresh
     for anyone with scripting off, a replace() so it does not litter the back
     button, and a visible link in case both fail.

     The target is absolute rather than relative so the file behaves the same
     wherever it is opened from — a relative desk.html only resolves once the
     file is sitting in the repo. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amenti &mdash; the Stardust Engine</title>
<meta http-equiv="refresh" content="0; url=https://ianingram.github.io/Amenti.live/Page1.html">
<link rel="canonical" href="https://ianingram.github.io/Amenti.live/Page1.html">
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;
    background:#07080c;color:#e8e4d9;
    font-family:"IBM Plex Sans",system-ui,sans-serif}
  .b{text-align:center;padding:24px}
  .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
  a{color:inherit;font-size:15px;display:inline-block;margin-top:10px}
</style></head>
<body>
  <div class="b">
    <div class="k">Amenti</div>
    <a href="https://ianingram.github.io/Amenti.live/Page1.html">Opening the Stardust Engine &rarr;</a>
  </div>
  <script>location.replace("https://ianingram.github.io/Amenti.live/Page1.html");</script>
</body></html>
