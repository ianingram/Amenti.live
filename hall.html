<!-- ── THE BLACK BOX · added 5 Sep ─────────────────────────────────────────
     FIRST SCRIPT ON THE PAGE, deliberately, because it can only catch what
     happens after it. A probe pasted into the console cannot see an error
     thrown at load — the error is already gone by the time the paste runs,
     and the only trace is a red dot in a toolbar that means "look somewhere
     else". That is a bad instrument: it reports that something is wrong and
     makes a person go hunting.

     This records instead. Anything that throws, and any failed fetch, lands
     in window.__amentiErrors, and probes/hall-probe.js reads it back. One
     paste then answers the whole question.

     It changes nothing and swallows nothing: every handler re-throws to the
     console exactly as before. ── -->
<script>
(function () {
  var E = window.__amentiErrors = [];
  window.addEventListener('error', function (e) {
    E.push({ at: new Date().toISOString(),
             kind: e.filename ? 'error' : 'resource',
             msg: e.message || 'failed to load',
             /* an SVG <image> href is an SVGAnimatedString, not a string, and
                stringifying it printed "[object SVGAnimatedString]" — a report
                that names nothing. Take .baseVal where it exists. */
             where: (function (t) {
               if (e.filename) return e.filename;
               if (!t) return '?';
               var u = t.src || t.href || t.currentSrc;
               if (u && u.baseVal != null) u = u.baseVal;
               return String(u || t.tagName || '?');
             })(e.target) +
                    (e.lineno ? ':' + e.lineno : '') });
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    E.push({ at: new Date().toISOString(), kind: 'promise',
             msg: String(e.reason && e.reason.message || e.reason).slice(0, 200), where: '\u2014' });
  });
})();
</script>

  /* ── THE ANSWER ───────────────────────────────────────────────────────────
     The answer was blue too, and it did not hold. The gate ROTATES, and its
     frames are brightest — pale cloud — exactly where a long answer sits. Blue
     read well over the pyramid's dark face and washed out over the sky, in the
     same paragraph. No single text colour survives every scene, so the fix is
     not a different blue: it is giving the answer A GROUND OF ITS OWN.

     White, on a dark panel, legible on every frame the gate can show. Not pure
     #fff — that glares on dark and reads like a system dialog; #f2f4f8 is white
     to the eye and sits in the page.

     The blue is not lost, it MOVES: it holds the left edge as a rule. The hall
     still speaks in its colour; the answer just no longer has to carry it.

     Selectors cover both containers because the box's own id belongs to
     amenti-hall-box.js, not to this page. */
  #ask-amenti .aa-answer,
  #hall-main .aa-answer {
    color: #f2f4f8;
    background: rgba(6,6,14,.72);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    border-left: 2px solid rgba(87,182,255,.45);
    border-radius: 10px;
    padding: 1.1rem 1.35rem;
    text-shadow: 0 1px 12px rgba(6,6,14,.9);
  }


  /* ── THE VIEW · CLICK THE SCENE TO CLEAR IT ───────────────────────────────
     The hall stands in a room, and the room is a photograph. Every other
     surface in this fleet puts its reading ON that photograph and never once
     lets a person LOOK at it.

     Click anywhere that is not a control and the reading fades out. Click
     again and it returns. Nothing is destroyed and nothing is re-fetched —
     the answer is still there, unchanged, behind a fade.

     opacity + visibility rather than display:none, so the return is a fade
     rather than a jump, and so a screen reader is told the text is gone
     instead of finding it and reading it aloud invisibly. */
  #hall-main, .hall-chrome {
    transition: opacity .45s ease, visibility .45s;
  }
  body.scene-bare #hall-main,
  body.scene-bare .hall-chrome {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* The one thing that stays: a line telling you how to get the reading back.
     A view with no way out of it is a trap, not a feature. */
  #scene-hint {
    position: fixed; left: 0; right: 0; bottom: 26px;
    text-align: center; z-index: 4;
    font: 400 11px/1.6 ui-monospace, Menlo, monospace;

    text-shadow: 0 1px 10px rgba(6,6,14,.95);
    opacity: 0; visibility: hidden; pointer-events: none;

  }
  body.scene-bare #scene-hint { opacity: 1; visibility: visible; }

  /* ── THE HAND-OVER ────────────────────────────────────────────────────────

<script>
/* THE GATE ROTATES. Cross-fade through the terminal scenes on a slow timer.
   Two layers: one shown, one hidden and preloading the next; swap, fade, repeat.
   ~60s hold, 2s fade (the CSS transition). A single scene never flashes empty —
   the outgoing layer holds until the incoming has faded in over it.
   Reduced-motion: show the first and stop. */
(function () {
  var SCENES = ['img/thoth-terminal-2.jpg', 'img/thoth-terminal-3.jpg'];
  var HOLD = 60000;
  var a = document.getElementById('frameA'),
      b = document.getElementById('frameB');
  if (!a || !b || !SCENES.length) return;

  a.style.backgroundImage = "url('" + SCENES[0] + "')";
  a.classList.add('show');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || SCENES.length < 2) return;

  var i = 0, front = a, back = b;
  setInterval(function () {
    i = (i + 1) % SCENES.length;
    back.style.backgroundImage = "url('" + SCENES[i] + "')";
    /* let the image decode a beat before fading it up */
    var img = new Image(); img.src = SCENES[i];
    img.onload = img.onerror = function () {
      back.classList.add('show');
      front.classList.remove('show');
      var t = front; front = back; back = t;
    };
  }, HOLD);
})();
</script>

<script>
/* The one door, carried by this page. Same Worker, same shape as Page1's
   client — duplicated DELIBERATELY so this page depends on nothing Page1
   loads. If the proxy contract changes, both clients change; that is the
   accepted cost of the flagship staying untouched. */
(function(){
  var PROXY = 'https://amenti-proxy.ingram-ian.workers.dev';
  var MODELS = ['claude-haiku-4-5-20251001','claude-sonnet-4-6'];
  var MODEL  = 'claude-sonnet-4-6';
  window.AmentiModel = { options: MODELS, DEFAULT: MODEL, get: function(){ return MODEL; }, set: function(){} };
  window.claude = {
    complete: async function(opts){
      opts = opts || {};
      var res = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: opts.system || '',
          messages: opts.messages || [],
          model: opts.model || MODEL
        })
      });
      if (!res.ok) {
        var t = await res.text().catch(function(){ return ''; });
        throw new Error('proxy ' + res.status + (t ? ' \u00b7 ' + t.slice(0,140) : ''));
      }
      var data = await res.json();
      if (data && data.usage) {
        window.AmentiCost = window.AmentiCost || { turns:0, inputTokens:0, outputTokens:0, last:null };
        window.AmentiCost.turns++;
        window.AmentiCost.inputTokens  += (data.usage.input_tokens  || 0);
        window.AmentiCost.outputTokens += (data.usage.output_tokens || 0);
        window.AmentiCost.last = { model: data.model, usage: data.usage, at: Date.now() };
      }
      return (data && data.reply ? String(data.reply) : '').trim();
    }
  };
})();
</script>

<!-- ── CLICK THE SCENE ──────────────────────────────────────────────────────
     Click the photograph and the reading clears; click again and it returns.
     Depends on nothing, breaks nothing if it fails, and touches no state that
     is not its own body class. -->
<script>
(function () {
  'use strict';

  /* WHAT MUST NEVER TRIGGER IT. This is the whole of the work — a toggle that
     fires on every click is not a feature, it is a page that will not let you
     type. A click is "on the scene" only if it landed on nothing that does
     anything: no input, no button, no link, no select, nothing a person is
     part-way through using. */
  var CONTROLS = 'input, textarea, select, button, a, [role="button"], [contenteditable], label, summary';

  function isControl(node) {
    for (var el = node; el && el !== document.body; el = el.parentElement) {
      if (el.matches && el.matches(CONTROLS)) return true;
      /* the hand-over widget draws its own controls and owns its clicks */
      if (el.id === 'amenti-handover') return true;
    }
    return false;
  }

  /* A DRAG IS NOT A CLICK. Selecting a line of the answer to copy it ends in
     a click event, and hiding the text the moment somebody finishes
     highlighting it would be maddening. If anything is selected, or the
     pointer travelled, it was not a click on the scene. */
  var downX = 0, downY = 0;
  document.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; }, true);

  function moved(e) {
    return Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4;
  }
  function selecting() {
    var sel = window.getSelection && window.getSelection();
    return !!(sel && String(sel).trim().length);
  }

  document.addEventListener('click', function (e) {
    if (isControl(e.target)) return;
    if (moved(e)) return;
    if (selecting()) return;
    document.body.classList.toggle('scene-bare');
  });

  /* ESCAPE ALWAYS RESTORES. A person who has hidden the reading and forgotten
     how should not have to guess; the hint says click, and Escape agrees. */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('scene-bare')) {
      document.body.classList.remove('scene-bare');
    }
  });

  /* AND ASKING BRINGS IT BACK BY ITSELF. If the reading is hidden and a
     question is sent, the answer would arrive into a pane nobody can see.
     Any keystroke into a field restores the hall first. */
  document.addEventListener('focusin', function (e) {
    if (isControl(e.target)) document.body.classList.remove('scene-bare');
  });
})();
</script>
