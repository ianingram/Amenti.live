<!-- ==========================================================================
  hall.html · ASK AMENTI — THE HALL'S OWN DOOR
  ---------------------------------------------------------------------------
  A standalone surface in Amenti.live. Page1 is NOT touched: this page carries
  its own proxy client (the same thirty lines, the same Worker, the same one
  door) and loads the hall scripts itself.

  Ruled 24 Aug: the hall lives with the ship, on its own page. It earns a link
  from the flagship's nav by proving itself here first — a link is one line;
  an injection is a graft.

  Serves at:  https://ianingram.github.io/Amenti.live/hall.html

  Needs, in this repo:
    HALL.md                 the meaning (authored)
    HALL-STATE.json         the counts (probes/probe-hall.mjs)
    ROSTER-INDEX.json       the souls  (probes/probe-roster.mjs)
    SOURCES.json            the catalogue (tools/sources.js — already live)

=========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Amenti · The Hall</title>
<meta name="description" content="Speak to the hall. Search the library of Amenti, and ask the building itself.">
<style>
  /* THE SHIP'S TYPEFACE — Amenti Display, the same @font-face the flagship
     uses (fonts/amenti-display-*.woff2). Relative path works because hall.html
     sits at the repo root beside Page1. Georgia was a stand-in; this is the
     ship's own letterform, so ASK AMENTI here matches ASK AMENTI in the nav. */
  @font-face { font-family:'Amenti Display'; font-weight:400; font-display:swap; src:url('fonts/amenti-display-400.woff2') format('woff2'); }
  @font-face { font-family:'Amenti Display'; font-weight:600; font-display:swap; src:url('fonts/amenti-display-600.woff2') format('woff2'); }
  @font-face { font-family:'Amenti Display'; font-weight:700; font-display:swap; src:url('fonts/amenti-display-700.woff2') format('woff2'); }
  :root { color-scheme: dark light; }
  body {
    margin: 0; min-height: 100vh;
    color: #e8e4d8;
    font: 16px/1.6 'Amenti Display', Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  /* THE GATE — slow cross-fade through the terminal scenes (thoth-terminal-2,
     -3): the planet risen behind the pyramid, framed by dark columns. Two
     stacked layers fade between images on a timer (script below). REAL FILES
     (img/), so they will not show in a detached preview — only live, beside
     img/. If one goes missing the #06060e beneath shows rather than a broken
     frame. Both images are bright at top-centre where ASK AMENTI sits, so the
     overlay — which rides ABOVE both layers — darkens that band on every
     scene. Reduced-motion holds a single still, no fade. */
  #hero-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #06060e; }
  #hero-bg .frame {
    position: absolute; inset: 0; background-size: cover;
    background-position: center 22%; background-repeat: no-repeat;
    opacity: 0; transition: opacity 2s ease-in-out;
  }
  #hero-bg .frame.show { opacity: 1; }
  #hero-bg .veil {
    position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(to bottom,
        rgba(6,6,14,.62) 0%, rgba(6,6,14,.30) 22%, rgba(6,6,14,.12) 45%,
        rgba(6,6,14,.35) 78%, rgba(6,6,14,.70) 100%),
      radial-gradient(ellipse at 50% 30%,
        rgba(6,6,14,.30) 0%, transparent 55%);
  }
  @media (prefers-reduced-motion: reduce) {
    #hero-bg .frame { transition: none; }
  }
  header { text-align: center; padding: 4.5rem 1rem 0.5rem; text-shadow: 0 2px 24px rgba(0,0,0,.7); }
  header h1 { font-family: 'Amenti Display', Georgia, serif; font-size: 2.1rem; font-weight: 700; letter-spacing: .14em; margin: 0; }
  header p  { opacity: .6; font-size: .95rem; margin: .4rem 0 0; font-style: italic; }
  /* main grows to fill the space between header and footer; the box sits at
     the LOW end of it, dropped toward the bottom of the screen above the
     footer links — not up under the title. */
  main { width: 100%; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 8vh; }
  footer { margin-top: auto; padding: 2rem 1rem; opacity: .45; font-size: .8rem; text-align: center; }
  footer .aa-links { display: flex; flex-direction: column; align-items: center; gap: .55rem; }
  footer .aa-llc { margin-top: 1rem; }
  footer a { color: inherit; }
  /* the box styles itself; #roster is absent here by design — it mounts at top of main */
  #ask-amenti { margin-top: 1rem; margin-bottom: 0; }
  header, main, footer { position: relative; z-index: 1; }

</style>
</head>
<body>

<div id="hero-bg" aria-hidden="true">
  <div class="frame" id="frameA"></div>
  <div class="frame" id="frameB"></div>
  <div class="veil"></div>
</div>

<header>
  <h1>ASK&nbsp;AMENTI</h1>
</header>

<main id="hall-main"></main>

<footer>
  <div class="aa-links">
    <a href="Page1.html">enter the Living Library</a>
    <a href="Amenti_Separation_of_Power.html">The Separation of Power</a>
  </div>
  <div class="aa-llc">Ingram Manor LLC</div>
</footer>

<script>
/* THE GATE ROTATES. Cross-fade through the terminal scenes on a slow timer.
   Two layers: one shown, one hidden and preloading the next; swap, fade, repeat.
   ~60s hold, 2s fade (the CSS transition). A single scene never flashes empty —
   the outgoing layer holds until the incoming has faded in over it.
   Reduced-motion: show the first and stop. */
(function () {
  var SCENES = ['img/thoth-terminal-2.jpg', 'img/thoth-terminal-3.jpg'];
  var HOLD = 60000;
  var a = document.getElementById('frameA'),
      b = document.getElementById('frameB');
  if (!a || !b || !SCENES.length) return;

  a.style.backgroundImage = "url('" + SCENES[0] + "')";
  a.classList.add('show');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || SCENES.length < 2) return;

  var i = 0, front = a, back = b;
  setInterval(function () {
    i = (i + 1) % SCENES.length;
    back.style.backgroundImage = "url('" + SCENES[i] + "')";
    /* let the image decode a beat before fading it up */
    var img = new Image(); img.src = SCENES[i];
    img.onload = img.onerror = function () {
      back.classList.add('show');
      front.classList.remove('show');
      var t = front; front = back; back = t;
    };
  }, HOLD);
})();
</script>

<script>
/* The one door, carried by this page. Same Worker, same shape as Page1's
   client — duplicated DELIBERATELY so this page depends on nothing Page1
   loads. If the proxy contract changes, both clients change; that is the
   accepted cost of the flagship staying untouched. */
(function(){
  var PROXY = 'https://amenti-proxy.ingram-ian.workers.dev';
  var MODELS = ['claude-haiku-4-5-20251001','claude-sonnet-4-6'];
  var MODEL  = 'claude-sonnet-4-6';
  window.AmentiModel = { options: MODELS, DEFAULT: MODEL, get: function(){ return MODEL; }, set: function(){} };
  window.claude = {
    complete: async function(opts){
      opts = opts || {};
      var res = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: opts.system || '',
          messages: opts.messages || [],
          model: opts.model || MODEL
        })
      });
      if (!res.ok) {
        var t = await res.text().catch(function(){ return ''; });
        throw new Error('proxy ' + res.status + (t ? ' \u00b7 ' + t.slice(0,140) : ''));
      }
      var data = await res.json();
      if (data && data.usage) {
        window.AmentiCost = window.AmentiCost || { turns:0, inputTokens:0, outputTokens:0, last:null };
        window.AmentiCost.turns++;
        window.AmentiCost.inputTokens  += (data.usage.input_tokens  || 0);
        window.AmentiCost.outputTokens += (data.usage.output_tokens || 0);
        window.AmentiCost.last = { model: data.model, usage: data.usage, at: Date.now() };
      }
      return (data && data.reply ? String(data.reply) : '').trim();
    }
  };
})();
</script>
<script src="amenti-hall.js" defer></script>
<script src="amenti-hall-box.js" defer></script>

</body>
</html>
