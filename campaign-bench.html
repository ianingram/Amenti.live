<!DOCTYPE html>
<meta charset="utf-8">
<title>the campaign, on a bench</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#05080e; color:#7d8ea6;
         font:400 11px/1.5 ui-monospace,Menlo,monospace; overflow:hidden }
  #wrap { position:fixed; inset:0 }
  svg { position:absolute; inset:0; width:100%; height:100% }
  #cap { position:absolute; left:50%; transform:translateX(-50%); bottom:58px;
         width:min(560px,86%); background:rgba(5,8,14,.92);
         border:1px solid rgba(43,58,80,.6); border-radius:4px; padding:10px 13px;
         color:#c3d3e6 }
  #cap .ch { color:#5d6e84; letter-spacing:.06em; font-size:9.5px; margin-bottom:6px }
  #cap .ch b { color:#e0913f; font-weight:400 }
  #cap .leg { margin-bottom:5px }
  #cap .out { color:#5d6e84; margin-left:.6em; font-size:9.5px;
              text-transform:uppercase; letter-spacing:.05em }
  #cap .says { color:#7d8ea6; font-size:10px; margin-top:1px }
  #cap .n { color:#4d5c70; font-size:9px; margin-top:7px; padding-top:5px;
            border-top:1px solid rgba(43,58,80,.4) }
  #nav { position:absolute; left:50%; transform:translateX(-50%); bottom:14px;
         display:flex; gap:6px; flex-wrap:wrap; justify-content:center }
  button { background:rgba(5,8,14,.9); border:1px solid rgba(43,58,80,.6);
           border-radius:3px; color:#7d8ea6; padding:3px 11px; cursor:pointer;
           font:inherit; letter-spacing:.05em }
  button:hover { color:#dbe8f5; border-color:#4b647d }
  button.on { color:#e0913f; border-color:#6a5330 }
  /* ── THE DIALS FOLD AWAY · 10 Sep 2026 ───────────────────────────────────
     A panel that sits over the thing being judged is a panel in the way. It
     opens when it is wanted and gets out of the picture when it is not. */
  #dials { position:absolute; left:12px; top:12px; background:rgba(5,8,14,.9);
           border:1px solid rgba(43,58,80,.6); border-radius:4px;
           width:212px; overflow:hidden; transition:opacity .18s }
  #dials.shut { width:auto }
  #dials.shut .body { display:none }
  #dials .body { padding:0 11px 9px }
  #dials.faint { opacity:.16 }
  #dials .h { display:flex; justify-content:space-between; align-items:center;
              cursor:pointer; padding:8px 11px; margin:0; border-bottom:0 }
  #dials.open .h { border-bottom:1px solid rgba(43,58,80,.6); margin-bottom:7px }
  #dials label { display:flex; justify-content:space-between; align-items:center;
                 gap:8px; margin:5px 0 }
  #dials span { color:#c3d3e6; min-width:44px; text-align:right }
  #dials input[type=range] { flex:1; accent-color:#c9503f; height:14px }
  #dials .h { color:#5d6e84; letter-spacing:.08em; font-size:9.5px;
              border-bottom:1px solid rgba(43,58,80,.6); padding-bottom:5px;
              margin-bottom:7px }
  #dials .n { color:#4d5c70; font-size:9px; margin-top:8px; padding-top:6px;
              border-top:1px solid rgba(43,58,80,.4) }
  /* ── THE PENCIL · 10 Sep 2026 ────────────────────────────────────────────
     Describing a rendering fault in words costs several exchanges and usually
     lands on the wrong thing — `the fleet is on the land` was three different
     faults on three different paths. A line drawn on the picture is one. */
  #ink { position:absolute; inset:0; width:100%; height:100%;
         pointer-events:none; z-index:5 }
  #ink.on { pointer-events:auto; cursor:crosshair }
  #stat { position:absolute; right:12px; top:12px; text-align:right; color:#4d5c70;
          font-size:9.5px; line-height:1.6 }
  @keyframes beat  { 0%,100%{opacity:.85} 50%{opacity:.16} }
  @keyframes beat2 { 0%{opacity:.5;transform:scale(.55)}
                     70%,100%{opacity:0;transform:scale(1.25)} }
  .r1 { animation:beat 1.5s ease-in-out infinite }
  .r2 { animation:beat2 1.5s ease-out infinite; transform-box:fill-box;
        transform-origin:center }
</style>

/* ============================================================================
   THE CAMPAIGN, ON A BENCH
   ----------------------------------------------------------------------------
   The same registers, the same ground image, the same projection as the live
   surface — and every rendering number on a slider.

   WHY THIS EXISTS. Sizing a field of four hundred ships took a dozen commits
   and a reload each. Ship size, spread, trail and moorage are RENDERING and
   not claims, and a rendering that has to be committed to be seen gets tuned
   about a fifth as well.

   WHAT IS NOT ON A DIAL. The ten legs, their order, their outcomes, their
   places and the one count the passage gives. Those come from ATTICA-MOVES.csv
   and if they are wrong the fix is in the register, not here.
   ========================================================================== */
const GROUND = 'data:image/jpeg;base64,' + B64;
const VB = 1000;

/* the Attica frame, from FRAMES.csv: 37.9838, 23.7275, radius 160 km */
const LAT = 37.9838, LON = 23.7275, R = 160;
const dLat = R / 111.32;
const dLon = R / (111.32 * Math.cos(LAT * Math.PI / 180));
const LA0 = LAT - dLat, LA1 = LAT + dLat, LO0 = LON - dLon, LO1 = LON + dLon;
const KM_PER_UNIT = (2 * R) / VB;

const proj = (lat, lon) => ({
  x: (lon - LO0) / (LO1 - LO0) * VB,
  y: (LA1 - lat) / (LA1 - LA0) * VB
});

const HUE = { fleet:'#c9503f', army:'#c9d6a8', flight:'#e0913f', battle:'#ffd166' };
const OUT = { unopposed:'#7fd8f0', taken:'#e0913f', landed:'#e0913f',
              arrived:'#8fd08f', lost:'#d05f5f', sailing:'#7fd8f0',
              withdrew:'#5d6e84' };

/* ── THE WATER SETS THE SHAPE, AND NOW IT ACTUALLY DOES · 10 Sep 2026 ──────
   Every version of the fleet field until now used a CONSTANT where the design
   always said the water decides, and the fleet drew across Euboea and over the
   Athens plain because nothing in the layer knew where the sea was.

   THE TERRAIN IMAGE IS THE MEASUREMENT. It is the same cut the surface draws,
   land at 30 m from Copernicus and sea at 462 m, and reading a pixel off it is
   asking the ground rather than guessing at it. Sea in this rendering is blue
   — the blue channel runs 37 to 46 above red — and land is grey, about 7. The
   threshold is 22, comfortably between them.

   A MARK THAT LANDS ASHORE IS WALKED SIDEWAYS UNTIL IT FINDS WATER, and if it
   cannot find any within a reasonable distance it is not drawn. A fleet with a
   few ships missing is honest; a fleet on a mountain is not. */
const WATER = (() => {
  const c = document.createElement('canvas');
  let ctx = null, W = 0, H = 0, data = null;
  const img = new Image();
  img.onload = () => {
    W = c.width = img.width; H = c.height = img.height;
    ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    data = ctx.getImageData(0, 0, W, H).data;
    if (steps.length) draw();
  };
  img.src = GROUND;
  return {
    ready: () => !!data,
    at(x, y) {
      if (!data) return true;                 /* unknown is not a refusal */
      const px = Math.round(x / 1000 * W), py = Math.round(y / 1000 * H);
      if (px < 0 || py < 0 || px >= W || py >= H) return true;
      const i = (py * W + px) * 4;
      return (data[i + 2] - data[i]) > 22;    /* blue clearly over red */
    },
    /* ── LOOK AROUND, NOT ONLY ACROSS · 10 Sep ─────────────────────────────
       The first nudge searched perpendicular to the lane, which works when the
       lane runs down the middle of open water and fails in a channel that
       bends away from it. THE EUBOEAN CHANNEL RUNS SOUTH-EAST AND THE LANE
       CUTS THE CORNER, so a mark on the Attic shore found nothing to either
       side of the lane and vanished.

       It now spirals outward from where the mark wanted to be and takes the
       nearest water in any direction. A SHIP GOES WHERE THERE IS SEA, and
       which way that is from a straight line drawn between two ports is not
       something the line knows. */
    nudge(x, y, nx, ny, reach) {
      if (this.at(x, y)) return [x, y];
      for (let d = 1.2; d <= reach; d += 1.4) {
        for (let a = 0; a < 12; a++) {
          const th = (a / 12) * Math.PI * 2;
          const qx = x + Math.cos(th) * d, qy = y + Math.sin(th) * d;
          if (this.at(qx, qy)) return [qx, qy];
        }
      }
      return null;
    }
  };
})();

const $ = id => document.getElementById(id);
const svg = $('s'), view = $('view'), layer = $('layer');
let K = 1, TX = 0, TY = 0;
let steps = [], step = 0, raf = 0, moving = [], running = false;

const D = () => ({
  n:   +$('d_n').value,
  sz:  +$('d_sz').value / 10,
  sp:  +$('d_sp').value,
  tr:  +$('d_tr').value / 100,
  rows:+$('d_rw').value,
  bay: +$('d_by').value / KM_PER_UNIT,
  ms:  +$('d_ms').value * 100,
  bt:  +$('d_bt').value / 10
});

function camera() {
  view.setAttribute('transform', `translate(${TX.toFixed(2)} ${TY.toFixed(2)}) scale(${K.toFixed(3)})`);
  $('stat').innerHTML = `×${K.toFixed(2)} · ${(KM_PER_UNIT*1000).toFixed(0)} m per unit<br>` +
    `step ${step+1} of ${steps.length||0}`;
}
function fitTo(pts, pad = 60) {
  if (!pts.length) return;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const x0 = Math.min(...xs)-pad, x1 = Math.max(...xs)+pad;
  const y0 = Math.min(...ys)-pad, y1 = Math.max(...ys)+pad;
  K = Math.min(VB/(x1-x0), VB/(y1-y0));
  K = Math.max(0.6, Math.min(9, K));
  TX = VB/2 - K*(x0+x1)/2; TY = VB/2 - K*(y0+y1)/2;
  camera();
}

/* ── the break-line ─────────────────────────────────────────────────────────
   Four segments with the middle offset. It is the drafting symbol for
   `something omitted here`, which is exactly the claim: a departure, an
   arrival, and nothing asserted about the water between. */
function zig(a, b) {
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, o=6/K;
  const p=[[a.x,a.y]];
  [[0.42,o],[0.5,0],[0.58,-o]].forEach(([t,s])=>
    p.push([a.x+dx*t+nx*s, a.y+dy*t+ny*s]));
  p.push([b.x,b.y]);
  return p;
}
function along(pts, t) {
  const seg=[]; let total=0;
  for (let i=0;i<pts.length-1;i++){
    const d=Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
    seg.push(d); total+=d;
  }
  const want=total*Math.max(0,Math.min(1,t)); let run=0;
  for (let i=0;i<seg.length;i++){
    if (run+seg[i]>=want){
      const u=seg[i]?(want-run)/seg[i]:0;
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*u,
              pts[i][1]+(pts[i+1][1]-pts[i][1])*u];
    }
    run+=seg[i];
  }
  return pts[pts.length-1];
}
function frame(pts, t) {
  const e=Math.min(0.999,Math.max(0.001,t));
  const p=along(pts,e), q=along(pts,Math.min(1,e+0.01));
  const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1;
  return {p, tx:dx/L, ty:dy/L, nx:-dy/L, ny:dx/L};
}

/* ── the field ──────────────────────────────────────────────────────────────
   Each mark holds a lag along the lane and an offset across it. Both fixed,
   so nothing shimmers and nothing about the shape changes while it moves —
   a field that tightened as it went would be drawing a manoeuvre. */
function field(n, spread, trail, seed) {
  const out=[];
  for (let i=0;i<n;i++){
    const u=(i+0.5)/n;
    const j=((i*0.7548776662 + seed*0.113)%1);
    const k=((i*0.5698402909 + seed*0.317)%1);
    out.push({ lag: trail*(0.15+0.85*u),
               across:(j-0.5)*2*spread,
               along:(k-0.5)*spread*0.9 });
  }
  return out;
}
/* ── THE ANCHORAGE · rewritten 10 Sep 2026 ─────────────────────────────────
   The first resting shape was a LATTICE — twelve rows of thirty-four, evenly
   spaced. It drew a red rectangle at every arrival, and a rectangle is the one
   thing a fleet at anchor is not. At Delos it sat as a block beside an island
   it was supposed to be lying around; at Karystos it ignored the bay entirely.

   THE WATER MASK MAKES THE RIGHT SHAPE AVAILABLE. Scatter the marks loosely
   behind the arrival and walk each one to the nearest sea, and the anchorage
   FILLS WHATEVER WATER IS THERE — around a headland, into a bay, up a channel.
   The shape comes from the coast rather than from a grid, which is what the
   design said from the first day and what no constant could deliver.

   IT IS STILL NOT A CLAIM ABOUT WHERE SHIPS LAY. Herodotus says `moored` and
   nothing else. What the coast supplies is the SPACE AVAILABLE, and filling it
   asserts less than a lattice does, because a lattice asserts an arrangement.
*/
function anchorage(m, d, reach) {
  const f = frame(m.pts, 0.999);
  const n = m.off.length;
  const R = reach;
  return m.off.map((o, i) => {
    /* a low-discrepancy disc, biased astern: the arrival is the front of the
       anchorage and the rest lies behind it, on the water it came in from */
    const u = (i + 0.5) / n;
    const a1 = ((i * 2.399963) % (Math.PI * 2));
    const r1 = R * Math.sqrt(u);
    const j = ((i * 0.7548776662) % 1) - 0.5;
    const da = -Math.abs(Math.cos(a1)) * r1 - R * 0.12 + j * R * 0.1;
    const db = Math.sin(a1) * r1 * 1.15 + j * R * 0.1;
    const x = f.p[0] + f.tx * da + f.nx * db;
    const y = f.p[1] + f.ty * da + f.ny * db;
    if (!WATER.ready()) return [x, y];
    const q = WATER.nudge(x, y, f.nx, f.ny, R * 0.55);
    return q || [x, y];
  });
}

function el(tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function draw() {
  cancelAnimationFrame(raf); moving=[];
  layer.textContent='';
  const g = steps[step]; if (!g) return;
  const d = D();
  /* partial counter-scale: a pin can hold its screen size because there is one
     of it; four hundred marks must give way as the ground shrinks */
  const iv = Math.pow(1/K, 0.55), z = 1/K;

  g.rows.forEach(r=>{
    const a = proj(+r.from_lat,+r.from_lon), b = proj(+r.to_lat,+r.to_lon);
    const col = OUT[r.outcome] || '#7d8ea6';
    const pts = zig(a,b);
    layer.appendChild(el('polyline',{
      points: pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),
      fill:'none', stroke:col, 'stroke-width':(1.2*z).toFixed(2), opacity:'.8' }));
    layer.appendChild(el('circle',{cx:a.x,cy:a.y,r:(2.2*z).toFixed(2),fill:col}));
    layer.appendChild(el('circle',{cx:b.x,cy:b.y,r:(3.2*z).toFixed(2),fill:col}));

    /* a ring where a leg arrived and changed the place */
    if (['taken','landed','unopposed'].includes(r.outcome)) {
      const ring = el('g',{transform:`translate(${b.x.toFixed(1)} ${b.y.toFixed(1)})`});
      ring.appendChild(el('circle',{r:(3.4*z).toFixed(2),fill:'none',
        stroke:r.outcome==='unopposed'?'#7fd8f0':'#d0402f',
        'stroke-width':(1.1*z).toFixed(2), class:'r1'}));
      ring.appendChild(el('circle',{r:(7.5*z).toFixed(2),fill:'none',
        stroke:r.outcome==='unopposed'?'#7fd8f0':'#d0402f',
        'stroke-width':(0.7*z).toFixed(2), class:'r2'}));
      layer.appendChild(ring);
    }

    /* SEVEN, because the passage says seven. The only number in ten rows. */
    const cnt = parseInt(r.count,10);
    if (cnt>0 && cnt<40) {
      for (let i=0;i<cnt;i++){
        const ang=(i/cnt)*Math.PI*2;
        layer.appendChild(el('circle',{
          cx:(b.x+Math.cos(ang)*9*z).toFixed(1),
          cy:(b.y+Math.sin(ang)*9*z).toFixed(1),
          r:(1.6*z).toFixed(2), fill:'#ff5a45'}));
      }
    }

    const kind = r.kind || 'fleet';
    const n = kind==='army' ? Math.round(d.n*0.3) : d.n;
    const sp = kind==='army' ? d.sp*0.45 : d.sp;
    const tr = kind==='army' ? Math.max(d.tr,0.34) : d.tr;
    const sz = (kind==='army'? d.sz*0.85 : d.sz) * iv;
    const tri = `M0,${(-sz).toFixed(2)}L${(sz*0.78).toFixed(2)},${(sz*0.72).toFixed(2)}L${(-sz*0.78).toFixed(2)},${(sz*0.72).toFixed(2)}Z`;
    const host = el('g',{});
    const off = field(n, sp, tr, g.ch%97);
    const frag = document.createDocumentFragment();
    off.forEach(()=>frag.appendChild(el('path',{d:tri,fill:HUE[kind]||col,opacity:'.85'})));
    host.appendChild(frag);
    layer.appendChild(host);
    const rec = {g:host, off, pts, outcome:r.outcome, kind, trail:tr};
    if (kind==='battle') rec.rest = null;
    /* EVERY FLEET LEG SETTLES ASTERN. A leg that merely arrives used to stop
       where the travelling field left it — spread around the point, inland
       included — which drew the fleet across the Athens plain at Phaleron. */
    if (kind === 'fleet' || kind === 'flight') {
      /* a fleet that stays gathers close; one passing through lies looser and
         further off */
      /* ── THE ANCHORAGE FILLS THE WATER, NOT A CIRCLE ROUND THE POINT ───
         The reach was five kilometres because Marathon bay is five. But an
         anchorage is not bounded by the bay it is named after: at Eretria the
         fleet lay along the Euboean channel, which runs for tens of kilometres
         and is the water actually available.

         So the dial goes to forty and the default is sixteen. THE MASK STILL
         DECIDES WHERE ANY MARK CAN SIT — a bigger reach only offers more water
         to find, and the coast keeps every ship on the sea. */
      const reach = (r.outcome==='sailing'||r.outcome==='withdrew')
        ? d.bay * 1.6 : d.bay * 1.05;
      rec.rest = anchorage(rec, d, reach);
    }
    moving.push(rec);
  });

  caption(g);
  travel();
}

function travel() {
  cancelAnimationFrame(raf);
  if (!moving.length) return;
  const d = D(); let t0 = 0;
  /* ── PACE IS ATTENTION, NOT DURATION · 10 Sep 2026 ────────────────────────
     The camera may move freely on this surface because WHERE A READER LOOKS
     ASSERTS NOTHING, and time on screen is the same kind of thing: how long we
     dwell is not how long it took. The durations that ARE known stay in the
     caption — six days of assault at Eretria, and the command rotating daily
     while Miltiades waited for his turn.

     And the battle legs are 1.4 km against crossings of a hundred. Equal time
     per leg already over-weights them; slowing further only admits that the
     weighting is deliberate. */
  const slow = moving.some(m => m.kind === 'battle') ? d.bt : 1;
  const tick = now => {
    if (!t0) t0 = now;
    const t = Math.min(1,(now-t0)/(d.ms*1.6*slow));
    const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    moving.forEach(m=>{
      const kids = m.g.childNodes;
      for (let i=0;i<kids.length;i++){
        const o = m.off[i];
        const f = frame(m.pts, e*(1+m.trail) - o.lag);
        let px = f.p[0] + f.nx*o.across + f.tx*o.along;
        let py = f.p[1] + f.ny*o.across + f.ty*o.along;
        if (m.kind === 'fleet' || m.kind === 'flight') { if (WATER.ready()) {
          const q = WATER.nudge(px, py, f.nx, f.ny, d.sp * 2.6);
          if (!q) { kids[i].setAttribute('opacity','0'); continue; }
          kids[i].setAttribute('opacity','.85');
          px = q[0]; py = q[1];
        } }
        const deg = Math.atan2(f.ty,f.tx)*180/Math.PI + 90;
        kids[i].setAttribute('transform',
          `translate(${px.toFixed(2)} ${py.toFixed(2)}) rotate(${deg.toFixed(1)})`);
      }
      if (t>0.8 && m.rest) {
        const u=(t-0.8)/0.2, w=u*u*(3-2*u);
        for (let k=0;k<kids.length;k++){
          const mm = String(kids[k].getAttribute('transform')||'')
            .match(/translate\(([-\d.]+) ([-\d.]+)\) rotate\(([-\d.]+)\)/);
          if (!mm) continue;
          const cx=+mm[1], cy=+mm[2];
          kids[k].setAttribute('transform',
            `translate(${(cx+(m.rest[k][0]-cx)*w).toFixed(2)} ${(cy+(m.rest[k][1]-cy)*w).toFixed(2)}) rotate(${mm[3]})`);
        }
      }
      if (t>=1 && m.outcome==='withdrew') m.g.setAttribute('opacity','.15');
    });
    if (t<1) raf = requestAnimationFrame(tick);
    else if (running) setTimeout(()=>{ if (running) next(); }, 700);
  };
  raf = requestAnimationFrame(tick);
}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function caption(g) {
  $('cap').innerHTML =
    `<div class="ch">${esc(g.label)}${g.rows.length>1?' · <b>at the same time</b>':''}</div>` +
    g.rows.map(r=>`<div class="leg"><b>${esc(r.name)}</b>` +
      `<span class="out">${esc(r.outcome)}${r.count?' · '+esc(r.count):''}</span>` +
      `<div class="says">${esc(r.says||r.note||'')}</div></div>`).join('') +
    `<div class="n">${step+1} of ${steps.length}</div>`;
}

function go(n) {
  step = Math.max(0, Math.min(steps.length-1, n));
  const g = steps[step];
  const pts = [];
  g.rows.forEach(r=>{ pts.push(proj(+r.from_lat,+r.from_lon));
                      pts.push(proj(+r.to_lat,+r.to_lon)); });
  fitTo(pts);
  draw();
}
function next() { if (step < steps.length-1) go(step+1); else running=false, $('b_run').classList.remove('on'); }

/* ── the register ───────────────────────────────────────────────────────────
   Herodotus orders the campaign: 6.97 through 6.116. Two pairs share a chapter
   and those run together — the fleet rounding Sunion while the army marches
   back overland. */
function parseCSV(t) {
  const lines = t.replace(/\r\n/g,'\n').split('\n');
  const split = l => { const c=[]; let cur='', q=false;
    for (const ch of l){ if(ch==='"'){q=!q;continue}
      if(ch===','&&!q){c.push(cur);cur='';continue} cur+=ch } c.push(cur); return c; };
  const cols = split(lines[0]).map(h=>h.trim());
  const out=[];
  for (let i=1;i<lines.length;i++){
    if(!lines[i].trim()||lines[i][0]==='#')continue;
    const c=split(lines[i]), o={};
    cols.forEach((h,j)=>o[h]=(c[j]||'').trim());
    out.push(o);
  }
  return out;
}

(function () {
  const rows = parseCSV(MOVES).filter(r=>r.from_lat && r.to_lat);
  rows.forEach(r=>{ const m=String(r.chapter||'').match(/(\d+)\.(\d+)/);
                    r._ch = m ? +m[1]*1000 + +m[2] : null; });
  const known = rows.filter(r=>r._ch!==null).sort((a,b)=>a._ch-b._ch);
  let last=null;
  known.forEach(r=>{
    if (last && last.ch===r._ch) { last.rows.push(r); return; }
    last = { ch:r._ch, label:r.chapter, rows:[r] }; steps.push(last);
  });
  document.getElementById('ground').setAttribute('href', GROUND);
  go(0);
})();

/* the pencil draws on its own canvas and touches nothing underneath */
(function () {
  const cv = $('ink'), b = $('b_pen');
  let on = false, down = false, cx = null;
  const fit = () => {
    const r = cv.getBoundingClientRect();
    const px = cv.width, py = cv.height;
    cv.width = Math.round(r.width); cv.height = Math.round(r.height);
    if (cx && px) { /* a resize clears the ink, which is honest enough */ }
    cx = cv.getContext('2d');
    cx.lineWidth = 2.2; cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.strokeStyle = '#ffd166';
  };
  addEventListener('resize', fit); setTimeout(fit, 60);
  b.onclick = () => { on = !on; cv.classList.toggle('on', on); b.classList.toggle('on', on); };
  $('b_clear').onclick = () => { if (cx) cx.clearRect(0, 0, cv.width, cv.height); };
  const pt = e => { const r = cv.getBoundingClientRect();
                    return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { if (!on) return; down = true;
    const p = pt(e); cx.beginPath(); cx.moveTo(p[0], p[1]); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!on || !down) return;
    const p = pt(e); cx.lineTo(p[0], p[1]); cx.stroke(); });
  addEventListener('pointerup', () => { down = false; });
})();
</script>
