# ============================================================================
# twins.yml  →  Amenti.live/.github/workflows/twins.yml
# ----------------------------------------------------------------------------
# Runs probes/probe-twins.mjs, which finds files that exist in both the
# repository root and probes/ and reports WHICH COPY EACH WORKFLOW, SCRIPT AND
# PAGE ACTUALLY NAMES.
#
# Five probes are known to be doubled — probe-attica, probe-citations,
# probe-geo, probe-post, probe-surfaces — plus probe14, probe15 and
# posts-example.json. Today the pairs were uploaded together and match.
# NOTHING KEEPS THEM MATCHING, and the day one of them is fixed the fleet holds
# two answers to one question.
#
# IT DELETES NOTHING AND COMMITS NOTHING. A deletion is the one action a probe
# cannot undo, and a file named by nothing in this repository may still be run
# by hand or reached from Fleet-Documents. The reading is the whole output.
# ============================================================================
name: twins

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the probe is here
        run: |
          if [ ! -f probes/probe-twins.mjs ]; then
            echo "MISSING: probes/probe-twins.mjs"
            exit 2
          fi
          echo "  root files:   $(ls -1 | wc -l)"
          echo "  probes/ files: $(ls -1 probes | wc -l)"

      - name: Run the probe
        run: |
          set -o pipefail
          node probes/probe-twins.mjs . | tee twins.log

      - name: Write the reading to the run summary
        if: always()
        run: |
          {
            echo '## twins · the same file in two places'
            echo
            echo '```'
            tail -140 twins.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twins
          path: |
            probe-twins.txt
            twins.log
          if-no-files-found: warn
