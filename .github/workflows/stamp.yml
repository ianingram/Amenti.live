# ── stamp.yml · END THE CACHE GREMLIN · Standing Slip #26 ────────────────────
# When any page or script changes, rewrite every  ?v=  in the HTML to the
# referenced file's CONTENT HASH. A changed file becomes a new URL, so GitHub
# Pages' ten-minute cache is bypassed automatically — no hard-reload, no wait,
# no "nothing changed" when something did.
#
# Separate from hall.yml on purpose: that job counts the roster and has its own
# careful commit/rebase logic; this one only touches version strings. Keeping
# them apart means neither can break the other.
name: stamp the cache

on:
  push:
    branches: [ main ]
    paths:
      - '**.js'
      - '**.css'
      - '**.html'
      - 'stamp-cache.mjs'
  workflow_dispatch:

# ── THE FIX FOR THE 403 · 3 Sep ──────────────────────────────────────────────
# Without this, GITHUB_TOKEN is read-only and the bot's push is denied:
#   "Permission to ianingram/Amenti.live.git denied to github-actions[bot]"
# hall.yml carries the same block; stamp.yml was missing it. contents:write lets
# the stamp commit its cache-bust back to main.
permissions:
  contents: write

# do not run on the stamp's own commit
concurrency:
  group: stamp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stamp every ?v= with its file's content hash
        run: node stamp-cache.mjs

      - name: commit if any stamp changed
        run: |
          git config user.name  "the stamp"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "all cache stamps already current"
          else
            # [skip ci] so this commit does not re-trigger the stamp
            git commit -m "stamp: cache-bust $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # ── THE REBASE WAS HERE; THE RETRY WAS NOT · 4 SEP 2026 ────────
            # This file already pulled before pushing, which handles the
            # ordinary case and is why it never went red. But the push itself
            # can still lose the race — the remote can move in the seconds
            # between the rebase and the push — and there was nothing to
            # catch that.
            #
            # It matters MORE here than in the other four. stamp.yml is the
            # workflow a human dispatches immediately after an upload, which
            # is exactly the moment another job is most likely to be in
            # flight. The one workflow run by hand at the busiest moment was
            # the one with no retry.
            #
            # And a lost stamp is not a lost measurement: it means hall.html
            # keeps serving an OLD ?v= for a file that changed, so every
            # reader who has the page cached gets the previous version and
            # reloading does not fix it. Silent, and cached — the failure
            # config.js warns about in its own header.
            #
            # GITHUB_REF_NAME rather than a hardcoded main, matching the
            # other four: a branch name written twice is a branch name that
            # can disagree with itself.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                echo "stamped (attempt $i)"
                break
              fi
              echo "push attempt $i lost the race; retrying"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the stamps could not be pushed after 5 attempts — hall.html on main still carries OLD ?v= values, so changed files will be served STALE from cache"
              exit 1
            fi
          fi
