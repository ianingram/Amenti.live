# THE HALL'S COUNTS
#
# Runs probe-roster.mjs and probe-hall.mjs and commits their registers:
#   ROSTER-INDEX.json   the souls, compact, for the hall's search
#   HALL-STATE.json     every number the hall may state
#
# Order matters: probe-hall reads ROSTER-INDEX.json, so the roster runs first.

name: the hall

on:
  schedule:
    # :42 — taken rungs: :07 :17 :27 :37 :47 (the strands), :52 (the third
    # tier), :22 (the source index). Two must never occupy one rung.
    - cron: '42 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-hall
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: the roster, then the counts
        run: |
          node probes/probe-roster.mjs .
          node probes/probe-hall.mjs .

      - name: commit if changed
        run: |
          if [ -z "$(git status --porcelain ROSTER-INDEX.json HALL-STATE.json)" ]; then
            echo "no drift — nothing to commit"
            exit 0
          fi
          git config user.name  "the hall"
          git config user.email "actions@users.noreply.github.com"
          git add ROSTER-INDEX.json HALL-STATE.json
          git commit -m "the hall: counted $(date -u +%Y-%m-%d)"
          git push

      - name: report
        if: always()
        run: |
          [ -f HALL-STATE.json ] && cat HALL-STATE.json || true
