# ============================================================================
#  .github/workflows/reroom.yml  ·  MOVE A READING ROOM
# ----------------------------------------------------------------------------
#  Renames a room's catalog AND every text inside its folder, in one commit.
#  Run it from the Actions tab: old key, new key, click Run.
#
#      library/caesar.json        ->  library/julius-caesar.json
#      library/caesar/*.md        ->  library/julius-caesar/*.md
#
#  ── WHY A WORKFLOW ────────────────────────────────────────────────────────
#  GitHub cannot rename a folder. Each file has to be re-pathed by hand, and
#  Julius's room holds the Gallic War in six parts and the Civil War in three.
#  Ten separate edits, ten chances to fat-finger a path, and a room is only a
#  room when its catalog and its texts agree — a half-moved room is worse than
#  an unmoved one, because library.js would resolve the catalog and 404 every
#  text behind it.
#
#  einstein-albert is the standing proof: ten ingested texts, a full manifest,
#  a README documenting its own carve-outs, AND NO CATALOG. Everything a room
#  needs except the one file that makes it resolvable, and the room was
#  unreachable for who knows how long.
#
#  So this moves the catalog and the texts TOGETHER or not at all.
#
#  ── WHY JULIUS NEEDS IT ───────────────────────────────────────────────────
#  `caesar` names two souls — Augustus and Julius, both on the roster — so
#  neither can claim it. But the room holds the Gallic War and the Civil War,
#  which are Julius's own commentaries, and the plates are Julius, and the
#  manifest says so outright.
#
#  A rename was begun and STOPPED HALFWAY: `julius-caesar` held a card while
#  `caesar` held the thumb, the terminal and the room. One figure, two keys,
#  both reported incomplete for months, and nothing connected the halves
#  because nothing was watching the shape of the names.
#
#  This finishes it. Then `caesar` answers to nobody and Augustus has clean
#  ground.
#
#  ── IT REPOINTS THE CATALOG TOO ───────────────────────────────────────────
#  Moving the files is not moving the room. A catalog that still says
#  "key": "caesar" with paths into caesar/ will RESOLVE and then 404 every text
#  behind it — and look perfect to every register in the fleet.
#
#  The first cut did exactly that, twice: Julius needed a hand-written catalog
#  afterwards and so did Gandhi. The workflow reintroduced the half-moved state
#  it was written to prevent. It now rewrites the key and the file paths, and
#  NOTHING ELSE — titles, sources, notes and sections are the part a person
#  wrote, and this script has no business touching them.
#
#  ── IT WILL NOT CLOBBER ───────────────────────────────────────────────────
#    · refuses if the old room does not exist
#    · refuses if the new key ALREADY has a catalog or a folder
#    · dry_run defaults TRUE
#    · git mv, so history follows every text
# ============================================================================
name: move a reading room

on:
  workflow_dispatch:
    inputs:
      old_key:
        description: 'The room as it is now, e.g. caesar'
        required: true
      new_key:
        description: 'The room it should be, e.g. julius-caesar'
        required: true
      dry_run:
        description: 'Dry run (shows every move, writes nothing)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  reroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan the move
        id: plan
        env:
          OLD: ${{ github.event.inputs.old_key }}
          NEW: ${{ github.event.inputs.new_key }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const OLD = process.env.OLD.trim(), NEW = process.env.NEW.trim();
            const ok = k => /^[a-z0-9-]+$/.test(k);
            if (!ok(OLD) || !ok(NEW)) { console.log("::error::keys must be lowercase letters, digits and hyphens"); process.exit(1); }
            if (OLD === NEW) { console.log("::error::the two keys are the same"); process.exit(1); }

            const cat = "library/" + OLD + ".json";
            const dir = "library/" + OLD;
            const newCat = "library/" + NEW + ".json";
            const newDir = "library/" + NEW;

            const hasCat = fs.existsSync(cat), hasDir = fs.existsSync(dir);
            if (!hasCat && !hasDir) { console.log("::error::no room at " + cat + " or " + dir); process.exit(1); }

            /* The destination FOLDER is fatal: two sets of texts cannot merge
               silently. The destination CATALOG is not, when there is no
               destination folder — that is a HALF-MOVED ROOM, an interrupted
               rename waiting to be finished, which is exactly what Julius is.
               The first cut refused it and blocked the very move that completes
               the job. */
            const newDirExists = fs.existsSync(newDir);
            const newCatExists = fs.existsSync(newCat);
            if (newDirExists) {
              console.log("::error::" + newDir + " ALREADY EXISTS. Two folders of texts cannot merge silently.");
              process.exit(1);
            }
            if (newCatExists && hasCat) {
              console.log("::error::BOTH catalogs exist. Read them and delete the wrong one first.");
              process.exit(1);
            }
            if (newCatExists && !hasCat) {
              console.log("HALF-MOVED ROOM. The catalog was renamed and the folder left behind.");
              console.log("This move finishes it.");
              console.log("::warning::confirm the destination catalog file paths point at " + NEW + "/");
            }

            const texts = hasDir ? fs.readdirSync(dir).filter(f => fs.statSync(path.join(dir, f)).isFile()) : [];

            console.log("MOVE  " + OLD + "  ->  " + NEW);
            console.log("");
            console.log("  catalog   " + (hasCat ? cat + "  ->  " + newCat : "NONE — the room has no catalog, which is the einstein-albert fault"));
            console.log("  texts     " + texts.length + (hasDir ? "" : "   (no folder)"));
            texts.forEach(f => console.log("      " + dir + "/" + f + "  ->  " + newDir + "/" + f));

            if (!hasCat) {
              console.log("");
              console.log("::warning::THIS ROOM HAS NO CATALOG. Moving the texts will not make it");
              console.log("::warning::resolvable — library.js reads library/{key}.json. Write the");
              console.log("::warning::catalog after this move or the room stays unreachable.");
            }

            fs.writeFileSync("/tmp/room.json", JSON.stringify({ OLD, NEW, cat, dir, newCat, newDir, hasCat, hasDir, texts }));
          '

      - name: Move it
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "reroom"
          git config user.email "reroom@amenti.live"
          node -e '
            const fs = require("fs"), cp = require("child_process");
            const P = JSON.parse(fs.readFileSync("/tmp/room.json", "utf8"));
            const q = s => JSON.stringify(s);

            if (P.hasCat) { cp.execSync("git mv " + q(P.cat) + " " + q(P.newCat)); console.log("  catalog moved"); }

            /* ── AND THE CATALOG'S CONTENTS ────────────────────────────────
               MOVING THE FILE IS NOT MOVING THE ROOM. The first cut renamed
               the catalog and the texts and left the catalog still saying
               "key": "caesar" with eleven paths pointing at caesar/.

               That is the HALF-MOVED STATE the whole workflow exists to
               prevent, reintroduced by the workflow itself: library.js would
               resolve the catalog and 404 every text behind it, and every
               register in the fleet would report the room as present and
               correct. Julius needed a hand-written catalog afterwards.
               Gandhi needed one too. It would have needed one every time.

               So the key and the paths are repointed here. ONLY those two
               things — the titles, the sources, the notes and the section
               names are carried across BYTE FOR BYTE, because they are the
               part a person wrote and this script has no business touching. */
            const catPath = P.hasCat ? P.newCat : (fs.existsSync(P.newCat) ? P.newCat : null);
            if (catPath) {
              try {
                const j = JSON.parse(fs.readFileSync(catPath, "utf8"));
                let touched = 0;
                if (j.key === P.OLD) { j.key = P.NEW; touched++; }
                for (const w of (j.works || [])) {
                  if (typeof w.file === "string" && w.file.startsWith(P.OLD + "/")) {
                    w.file = P.NEW + "/" + w.file.slice(P.OLD.length + 1);
                    touched++;
                  }
                }
                if (touched) {
                  fs.writeFileSync(catPath, JSON.stringify(j, null, 2) + "\n");
                  cp.execSync("git add " + q(catPath));
                  console.log("  catalog repointed  " + touched + " field(s): key and file paths now read " + P.NEW);
                } else {
                  console.log("  catalog already points at " + P.NEW);
                }
              } catch (e) {
                console.log("::warning::could not repoint " + catPath + " (" + e.message + "). "
                  + "THE TEXTS MOVED AND THE CATALOG DID NOT — check its key and file paths by hand.");
              }
            }
            if (P.hasDir) {
              fs.mkdirSync(P.newDir, { recursive: true });
              for (const f of P.texts) {
                cp.execSync("git mv " + q(P.dir + "/" + f) + " " + q(P.newDir + "/" + f));
                console.log("  moved  " + f);
              }
            }
          '
          git add -A -- library
          if git diff --staged --quiet; then
            echo "::error::nothing staged after the moves — that should be impossible"
            exit 1
          fi
          git commit -m "room: ${{ github.event.inputs.old_key }} -> ${{ github.event.inputs.new_key }}"
          pushed=0
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "push attempt $i did not land; retrying from a clean tree"
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          [ "$pushed" = "1" ] || { echo "::error::the move could not be pushed"; exit 1; }
          echo "committed"

      - name: What happens next
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo ""
            echo "  DRY RUN — nothing written. Re-run with dry_run: false."
          else
            echo ""
            echo "  Done. The push touches library/, so THE PLATE REGISTER FIRES on"
            echo "  its own and the KEY REGISTER runs behind it."
            echo ""
            echo "  Read that run. The old key should have vanished from every list,"
            echo "  and the new one should hold both plates and a room."
          fi
