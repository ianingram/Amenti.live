name: Atlantica dispatch

# v1: manual trigger only. Click "Run workflow" in the Actions tab, optionally
# typing a figure key, and review the committed dispatch. When you trust the
# output, uncomment the `schedule` block below to publish one automatically
# every day.

on:
  workflow_dispatch:
    inputs:
      figure:
        description: "Figure key (blank = next figure without a dispatch)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no API call, writes a stub to test the plumbing)"
        required: false
        default: "false"
  # schedule:
  #   - cron: "0 11 * * *"   # 11:00 UTC daily — uncomment when ready

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install @anthropic-ai/sdk

      - name: Generate dispatch
        run: node scripts/generate-dispatch.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGURE_KEY: ${{ github.event.inputs.figure }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          ATLANTICA_MODEL: claude-sonnet-4-6

      - name: Commit and push if changed
        run: |
          git config user.name "Atlantica Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atlantica.json
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            # [skip ci] so this commit does not re-trigger a workflow
            git commit -m "Atlantica: new dispatch [skip ci]"
            # ── REBASE AND RETRY · 4 SEP 2026 ─────────────────────────
            # Found by probes/probe-workflows.mjs, which exists because a
            # HAND AUDIT of the automation on this same day read five files,
            # declared "five of five carry the correction", and missed this
            # one. Nobody had a list; you cannot audit what nothing maps.
            #
            # A bare push is correct in isolation and wrong the moment
            # anything else writes to the branch — routine here, with eight
            # committing workflows and a human all on main. flagship.yml went
            # red earlier today with "! [rejected] main -> main" after an
            # upload landed mid-job: a good measurement thrown away by a
            # collision, not by a fault.
            #
            # Five attempts, then SAY SO. A silent give-up leaves the register
            # stale on main while the job reports success.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                echo "pushed (attempt $i)"
                break
              fi
              echo "push attempt $i lost the race; retrying"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the Atlantica dispatch could not be pushed after 5 attempts — main is STALE"
              exit 1
            fi
          fi
