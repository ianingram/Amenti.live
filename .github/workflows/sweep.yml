# THE SWEEP
#
# Removes files that have finished their work. MANUAL ONLY, DRY-RUN BY DEFAULT,
# and it REFUSES to delete anything the repo still mentions.
#
# ── WHY THIS IS THE MOST DANGEROUS WORKFLOW ON THE SHIP ─────────────────────
# Every other workflow adds or measures. This one takes away, and a wrong
# deletion is discovered days later by a page that has quietly stopped working.
# So it is built the opposite way round from the others:
#
#   1 · NEVER SCHEDULED, NEVER ON PUSH. A sweep that runs by itself is a sweep
#       nobody is watching. Dispatch only, by a person, on purpose.
#
#   2 · DRY RUN IS THE DEFAULT. It prints what it would remove and stops. To
#       actually delete, the word SWEEP must be typed into `confirm`. A default
#       that destroys is a trap for the one time somebody clicks through.
#
#   3 · IT GREPS THE REPO FIRST AND REFUSES. If any file still mentions a
#       candidate by name, that candidate is KEPT and the run says so. This is
#       the guard that matters: the reason geo-tier.mjs is on the list is that
#       it is orphaned, and the way to be sure is to look, not to remember.
#
# NOTHING IS TRULY LOST. Git keeps every deleted file in history; `git show
# <sha>:<path>` brings it back. This removes files from the WORKING TREE, which
# is where confusion lives — two copies of one classifier that have already
# drifted is worse than one copy plus a history.
#
# ── HOW TO ADD A CANDIDATE ──────────────────────────────────────────────────
# Put it in CANDIDATES below with a reason on the same line. A file with no
# stated reason does not get swept: if nobody can say why it goes, it stays.

name: the sweep

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SWEEP to actually delete. Anything else is a dry run.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: the-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: what would go, and what is still spoken for
        id: plan
        run: |
          # ── THE CANDIDATES · path | why ─────────────────────────────────
          # Proven duplicates first. Everything below them is judgement, and
          # the reference check is what keeps judgement from being a mistake.
          cat > /tmp/candidates.txt <<'LIST'
          book/book-the-harvester.md|duplicate chapter, kept as book/24-the-harvester.md — on the hall-upgrade handoff's own loose-ends list
          apply_fix_01.py|one-shot fixer, ran two months ago
          apply_fix_02.py|one-shot fixer, ran two months ago
          remove_moon_key.py|one-shot fixer, ran two months ago
          strip-tweaks-panel.sh|one-shot fixer, ran two months ago
          merge.js|stale duplicate of tools/merge.js — the two DIFFER (12759 vs 18868 bytes) and fleet-manifest.js says it is GENERATED BY tools/merge.js
          LIST
          # REMOVED FROM THIS LIST BY THE FIRST DRY RUN, 4 Sep:
          #   geo-tier.mjs   already deleted by hand
          #   audit2.py      called by .github/workflows/main.yml and apply_art_session.py
          #   goldleaf2.py   same
          #   HANDOFF.md     same
          #   seeds_scan.py  called by tools/plates.js
          #   merge.js       named by citations.yml, scan.yml, probe18.js and
          #                  others — the basename check cannot tell merge.js
          #                  from tools/merge.js, so it refused on ambiguity.
          #                  Two copies of different sizes DO exist; resolve
          #                  with a path-precise grep before sweeping either.
          #   TODO.md        NOT a stale list. A session record of 1 Aug with
          #                  live findings and, crucially, sections headed
          #                  "CLOSED BY DECISION — do not reopen" and "KNOWN
          #                  DEFECTS, RECORDED NOT FIXED". Deleting it would
          #                  destroy decisions that are meant to stop a future
          #                  session relitigating them. Two of its three "broken
          #                  now" items are since fixed (Hume's three texts
          #                  resolve; Shaka is in as SHAKA ZULU with a room);
          #                  img/prompts/ is still 404. The real fault is the
          #                  NAME: "TODO" reads as a working list, so nobody
          #                  opens it. Rename to SESSION-2026-08-01.md, or fold
          #                  the live threads into the slip and then delete.
          # And apply_fix_03.py was pulled after the SECOND dry run: HANDOFF.md
          # names 01 and 02 but not 03, and sweeping one of a set of three
          # leaves a broken trio with no record of why. All three go together,
          # with HANDOFF.md edited, or none do.
          # Four of twelve were live. The guard was right and the reasoning
          # that put them on the list was wrong — which is why the guard runs
          # before the delete and not after.

          echo "── the sweep ────────────────────────────────────────────"
          go=0; keep=0; missing=0
          : > /tmp/todelete.txt

          while IFS='|' read -r path why; do
            [ -z "$path" ] && continue
            if [ ! -e "$path" ]; then
              echo "  ·  $path — already gone"
              missing=$((missing+1)); continue
            fi

            # ── THE REFERENCE CHECK · CORRECTED AFTER THE FIRST DRY RUN ──
            # The first version searched every tracked file and kept anything
            # that was named anywhere. It kept ALL TWELVE — because CHART.json
            # is a GENERATED INVENTORY OF THE REPO and therefore names every
            # file in it. Being listed in a catalogue means "this exists", not
            # "this is used". A guard that can never pass is not a guard.
            #
            # So the search now separates two kinds of mention:
            #
            #   A CALLER   a workflow, a script, a page that would BREAK
            #              -> the file is KEPT. This is the real guard, and on
            #                 the first run it correctly saved audit2.py,
            #                 goldleaf2.py, HANDOFF.md (all named by
            #                 .github/workflows/main.yml and
            #                 apply_art_session.py) and seeds_scan.py (named by
            #                 tools/plates.js). "Two months idle" was wrong
            #                 about every one of them.
            #
            #   A CATALOGUE  a generated register that lists what exists
            #              -> the file may go, AND THE REGISTER MUST BE
            #                 REGENERATED AFTER, or it now describes a file
            #                 that is not there. That is stated per file below,
            #                 never silently ignored.
            #
            # Other candidates are excluded too: HANDOFF.md naming apply_fix_01
            # is not a reason to keep either, since both are going.
            base=$(basename "$path")

            all=$(git grep -l -F -- "$base" -- . \
                  ':!'"$path" ':!.github/workflows/sweep.yml' 2>/dev/null || true)

            # generated inventories — they describe the tree, they do not use it
            cats=$(echo "$all" | grep -E '^(CHART|SOURCES|SURFACES|WORKFLOWS|SERVES|BOOK|PRODUCTION|SPELL|CITATIONS)[A-Za-z.-]*\.json$' || true)
            # a mention inside another candidate is not a reason to keep
            others=$(echo "$all" | grep -F -x -f <(cut -d'|' -f1 /tmp/candidates.txt) || true)
            callers=$(echo "$all" | grep -v -x -F -e "$cats" -e "$others" 2>/dev/null | grep -v '^$' || true)

            if [ -n "$callers" ]; then
              echo "  ✗  $path — KEPT, a caller still needs it:"
              echo "$callers" | sed 's/^/         /'
              keep=$((keep+1))
            else
              echo "  →  $path — $why"
              if [ -n "$cats" ]; then
                echo "         catalogued in: $(echo $cats | tr '\n' ' ')"
                echo "         ^ regenerate these after the sweep, or they describe a file that is gone"
              fi
              echo "$path" >> /tmp/todelete.txt
              go=$((go+1))
            fi
          done < /tmp/candidates.txt

          echo "─────────────────────────────────────────────────────────"
          echo "$go to remove · $keep kept because something still names them · $missing already gone"
          echo "count=$go" >> "$GITHUB_OUTPUT"

      - name: dry run — nothing was removed
        if: inputs.confirm != 'SWEEP'
        run: |
          echo "DRY RUN. Nothing was deleted."
          echo "To sweep for real, run this workflow again and type SWEEP into confirm."
          echo "Read the list above first — anything marked KEPT is still referenced"
          echo "and would be a real breakage."

      - name: sweep
        if: inputs.confirm == 'SWEEP' && steps.plan.outputs.count != '0'
        run: |
          git config user.name  "the sweep"
          git config user.email "actions@users.noreply.github.com"
          while read -r p; do
            [ -z "$p" ] && continue
            git rm -q -- "$p"
            echo "removed $p"
          done < /tmp/todelete.txt

          git commit -m "the sweep: $(wc -l < /tmp/todelete.txt) file(s) removed $(date -u +%Y-%m-%d) [skip ci]"
          # the same rebase-and-retry every committing workflow carries (#62)
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=1; echo "swept (attempt $i)"; break
            fi
            echo "push attempt $i lost the race; retrying"
            sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::the sweep could not be pushed after 5 attempts — nothing was removed from main"
            exit 1
          fi
          echo "Every removed file remains in git history: git show HEAD~1:<path>"
