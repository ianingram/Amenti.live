name: plate register

# Regenerates img/PLATES.json whenever the images or the generator change.
#
# WHY THE PUSH LOOKS THE WAY IT DOES
#   A plain `git push` raced the fleet-scanner workflow: both jobs check out
#   main, do their work, and push. Whichever finishes second is rejected,
#   because the remote moved underneath it. Git was right to refuse.
#
#   `git pull --rebase` replays this commit on top of whatever landed while the
#   job was running, so the two registers stop fighting over the same ref. The
#   retry loop covers the case where the remote moves again during the rebase.
#
#   [skip ci] on the commit stops this workflow re-triggering itself. Without
#   it, writing PLATES.json under img/ matches the push filter below and the
#   job fires again on its own output.

on:
  workflow_dispatch:
  push:
    paths:
      - 'img/**'
      - 'names.csv'
      - 'library/**'
      - 'tools/plates.js'
      - 'tools/keyring.js'
      - 'tools/chart.js'

jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Walk img/ and write PLATES.json
        run: node tools/plates.js

      # THE KEY REGISTER runs immediately after, because it READS PLATES.json.
      # Two readings, one push: the plates as they are, and what their keys
      # actually reach on the roster. Order matters — keyring against a stale
      # register would report yesterday's collisions.
      - name: Walk the keys and write KEYS.json
        run: node tools/keyring.js

      # ── THE CHART ─────────────────────────────────────────────────────────
      # Third, because it reads what the first two wrote. It records EXISTENCE
      # AND OWNERSHIP across the whole system — every file, and which register
      # speaks for it.
      #
      # EVERY FAULT THIS WEEK LIVED IN THE WATER BETWEEN TWO REGISTERS. Not one
      # was an error inside a register: gw-winter was a scene the PLATE register
      # counted as a figure; Julius was one man across two keys no single
      # register could see; the Harbor was replaced and nothing watched panes;
      # eight of forty-one briefs were linked and nothing watched briefs. Every
      # one of those registers was telling the truth about its own island.
      #
      # This is the chart of the water.
      #
      # It runs WITHOUT a token, so it charts this repo and records the other
      # four as UNREACHABLE — which is a different answer from empty, and it
      # says so. Give it a token later if the fleet-wide reading is wanted; a
      # partial chart that admits it is partial is worth having today.
      - name: Chart the archipelago
        run: node tools/chart.js .

      - name: Commit the register if it changed
        run: |
          git config user.name  "amenti-register"
          git config user.email "register@amenti.live"
          git add img/PLATES.json img/KEYS.json CHART.json
          git diff --staged --quiet && exit 0
          git commit -m "register: regenerate PLATES.json [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          echo "could not push after 5 attempts"; exit 1
