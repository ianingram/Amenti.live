# .github/workflows/librarian.yml
# THE LIBRARIAN — reads library/ and writes LIBRARY.json (a reading, not a memory).
# Runs when the library changes, and on a daily schedule as a backstop, so the
# Codex's "unlocked" count is always a reading of the real shelves.
name: librarian

on:
  push:
    branches: [main]
    paths:
      - 'library/**'          # any room or manifest change re-reads the library
  workflow_dispatch: {}        # run by hand from the Actions tab
  schedule:
    - cron: '0 6 * * *'        # daily 06:00 UTC backstop

# the job commits LIBRARY.json back to the repo, so it needs write access
permissions:
  contents: write

concurrency:
  group: librarian
  cancel-in-progress: false

jobs:
  read-the-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the librarian
        run: node probes/probe-library.mjs
        env:
          LIBRARY_DIR: library
          LIBRARY_OUT: LIBRARY.json

      - name: Commit the reading if it changed
        run: |
          git add LIBRARY.json
          if git diff --cached --quiet -- LIBRARY.json; then
            echo "LIBRARY.json unchanged — nothing to commit."
          else
            git config user.name  "amenti-librarian"
            git config user.email "librarian@amenti.live"
            git commit -m "librarian: re-read the library [skip ci]"
            # ── REBASE AND RETRY · 4 SEP 2026 ─────────────────────────
            # Found by probes/probe-workflows.mjs, which exists because a
            # HAND AUDIT of the automation on this same day read five files,
            # declared "five of five carry the correction", and missed this
            # one. Nobody had a list; you cannot audit what nothing maps.
            #
            # A bare push is correct in isolation and wrong the moment
            # anything else writes to the branch — routine here, with eight
            # committing workflows and a human all on main. flagship.yml went
            # red earlier today with "! [rejected] main -> main" after an
            # upload landed mid-job: a good measurement thrown away by a
            # collision, not by a fault.
            #
            # Five attempts, then SAY SO. A silent give-up leaves the register
            # stale on main while the job reports success.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                echo "pushed (attempt $i)"
                break
              fi
              echo "push attempt $i lost the race; retrying"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::the library reading could not be pushed after 5 attempts — main is STALE"
              exit 1
            fi
          fi
